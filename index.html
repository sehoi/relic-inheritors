<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>계승자 / Relic Inheritors</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0c10;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      /**
       * 부팅 중 에러를 화면에 그대로 찍는다.
       *
       * 실패하면 캔버스가 그냥 검게 남는다 — 콘솔을 볼 수 없는 환경(모바일 등)에서는
       * "안 되는데 왜 안 되는지" 조차 알 수 없다. capture 단계에서 듣는 이유는 스크립트
       * 로딩 자체가 실패하는 경우(리소스 에러)는 버블링하지 않기 때문이다.
       */
      (function () {
        function show(text) {
          var pre = document.getElementById('boot-error');
          if (!pre) {
            pre = document.createElement('pre');
            pre.id = 'boot-error';
            pre.style.cssText =
              'position:fixed;inset:0;margin:0;padding:16px;background:#0b0c10;' +
              'color:#e07070;font:12px/1.5 monospace;white-space:pre-wrap;' +
              'word-break:break-word;z-index:9999;overflow:auto;';
            document.body.appendChild(pre);
          }
          pre.textContent += (pre.textContent ? '\n\n' : '부팅 중 에러:\n') + text;
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.message) show(e.message + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : ''));
            else if (e.target && e.target.src) show('리소스를 못 불러왔다: ' + e.target.src);
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.stack) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
